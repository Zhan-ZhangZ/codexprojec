[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-account-mcp"
version = "0.1.0"
description = "Personal Telegram account MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "cryptography>=46.0.5",
    "mcp[cli]>=1.21.0",
    "pydantic-settings>=2.13.1",
    "sqlalchemy[asyncio]>=2.0.48",
    "telethon>=1.42.0",
    "uvicorn[standard]>=0.42.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tg_mcp"]
