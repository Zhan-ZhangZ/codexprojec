# Packaging for `aers-score` — the CLI front end to the AERS numeric benchmark.
#
# Scope note: this file packages exactly one thing, the `aers_score` console
# script. It does NOT package the skills catalog, the eval harness, or the
# benchmark datasets. The exam (task specs + datasets + graders) is resolved
# from a checkout at runtime — see aers_score/exam.py for why a bundled second
# copy of the datasets would be a drift surface with no upside.
#
# Install from a checkout:
#     pip install -e .            # or: uv tool install --editable .
#     aers-score tasks
#
# The repo itself stays stdlib-only: nothing in `make check` imports this
# package's dependencies, because it has none.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aers-score"
description = "Score an empirical-research agent against the AERS numeric benchmark"
readme = "aers_score/README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-SA-4.0" }
authors = [{ name = "Bryce Wang" }]
keywords = ["econometrics", "causal-inference", "benchmark", "agents", "reproducibility"]
dynamic = ["version"]

# Deliberately empty. Every grader in benchmark/ is stdlib-only (TOML via
# scripts/toml_compat.py on Python 3.9/3.10), and this CLI must stay installable
# in the same minimal environment an agent author already has.
dependencies = []

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/brycewang-stanford/Auto-Empirical-Research-Skills"
Benchmark = "https://github.com/brycewang-stanford/Auto-Empirical-Research-Skills/tree/main/benchmark"
Scoreboard = "https://github.com/brycewang-stanford/Auto-Empirical-Research-Skills/blob/main/docs/EXTERNAL_SCOREBOARD.md"

[project.scripts]
aers-score = "aers_score.cli:main"

[tool.setuptools]
packages = ["aers_score"]

[tool.setuptools.dynamic]
version = { attr = "aers_score.__version__" }
